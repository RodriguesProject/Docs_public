<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript — verificador de aprovação</title>
    <script src="FeBe_script_aula17.js" defer></script>
</head>
<body>
    <main>
        <h1>Calculadora de aprovação</h1>
        <label for="nota">Digite a nota (0 a 10):</label>
        <input type="number" id="nota" min="0" max="10" step="0.1" required>
        <button type="button" onclick="verificaAprovacao()">Verificar aprovação</button>
        <p id="resultado" role="status" aria-live="polite"></p>
    </main>
</body>
</html>
