<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aula 19 — DOM e switch-case</title>
<link rel="stylesheet" href="FeBe_style_aula19.css">
<script src="FeBe_script_aula19.js" defer></script>
</head>
<body><main>
<h1>Manipulação de elementos do DOM</h1>
<section><h2>Alteração de cores</h2>
<button type="button" onclick="trocaCor()">Trocar cores</button>
<button type="button" onclick="resetarCor()">Restaurar cores</button>
<div class="painel-cores"><div id="div-1" class="divTrocaCor">Div 1</div><div id="div-2" class="divTrocaCor">Div 2</div><div id="div-3" class="divTrocaCor">Div 3</div></div>
</section>
<section><h2>Calculadora básica</h2>
<label for="num1">Primeiro número</label><input type="number" id="num1" step="any">
<label for="operador">Operação</label><select id="operador"><option value="+">+</option><option value="-">−</option><option value="*">×</option><option value="/">÷</option></select>
<label for="num2">Segundo número</label><input type="number" id="num2" step="any">
<button type="button" onclick="calcularOperacao()">Calcular</button><p id="resultado" role="status" aria-live="polite"></p>
</section></main></body></html>
